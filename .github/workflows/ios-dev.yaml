name: Flutter - iOS Build development
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: running platform
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

#      - name: Setup BASE URL File
#        run: echo "${{ secrets.BASE_URL_FILE }}" | base64 --decode > lib/core/data/remote/base_url.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
      - run: flutter --version

      - name: Clear Dependencies
        run: flutter clean

      - name: Install Dependencies
        run: flutter pub get

      - name: Install iOS Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Auto format the dart code
        run: dart format .

      - name: Verify the dart code formatted
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze the dart code
        run: flutter analyze --fatal-warnings

      - name: Run tests
        run: flutter test

      - name: widget test
        run: flutter test test/unit_and_widget_test/animation_screen_test.dart

      - name: Build iOS
        run: flutter build ipa --debug --build-name=1.0.0 --build-number=1 --no-codesign

      